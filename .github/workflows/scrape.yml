name: Scrape agenda

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC (~07:00 Barcelona)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run scrape

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update agenda data"
          git push
