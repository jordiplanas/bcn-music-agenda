<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda Música Barcelona — Sales Petites</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agenda BCN" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<style>
  :root {
    --bg: #000000;
    --ink: #f2f2ee;
    --muted: #8c8c86;
    --line: #f2f2ee;
    --accent: #ff3f00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", Helvetica, Arial, sans-serif;
  }
  a { color: inherit; }
  header {
    padding: 28px 24px 18px;
    border-bottom: 2px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  header h1 span { color: var(--accent); }
  header p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    #layout { grid-template-columns: 1fr; }
    #venues { border-right: none !important; border-bottom: 2px solid var(--line); }
  }
  #venues {
    padding: 20px;
    border-right: 2px solid var(--line);
    height: fit-content;
  }
  #venues h2 {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 14px; font-weight: 500;
  }
  .venue-check { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.01em; cursor: pointer; }
  .venue-check input { accent-color: var(--accent); width: 14px; height: 14px; }
  .swatch { width: 13px; height: 13px; flex: none; border: 1px solid var(--line); }
  #toggle-all {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--bg); background: var(--ink); border: 2px solid var(--ink);
    cursor: pointer; padding: 7px 10px; margin-bottom: 14px; font-family: inherit; font-weight: 500;
  }
  #toggle-all:hover { background: var(--bg); color: var(--ink); }
  #calendar-wrap { padding: 20px; }

  .fc { color: var(--ink); font-family: inherit; }
  .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { border-color: var(--line); background: transparent; }
  .fc-daygrid-day-number { color: var(--ink); font-size: 0.85rem; }
  .fc-col-header-cell-cushion {
    color: var(--muted); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.06em; font-weight: 500;
  }
  .fc-day-today { background: rgba(255,63,0,0.12) !important; }
  .fc-button-primary {
    background: transparent !important; border: 2px solid var(--ink) !important; color: var(--ink) !important;
    text-transform: uppercase; font-size: 0.72rem !important; letter-spacing: 0.05em; font-family: inherit;
    border-radius: 0 !important; box-shadow: none !important; padding: 6px 12px !important;
  }
  .fc-button-primary:hover { background: var(--ink) !important; color: var(--bg) !important; }
  .fc-button-primary:not(:disabled).fc-button-active,
  .fc-button-primary:not(:disabled):active { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--bg) !important; }
  .fc-toolbar-title { font-size: 1.1rem !important; text-transform: uppercase; letter-spacing: -0.01em; font-weight: 700 !important; }
  .fc-event { border-radius: 0 !important; padding: 2px 4px; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.01em; cursor: pointer; }
  .fc-daygrid-event { white-space: normal; }
  .fc-daygrid-day-frame { border-radius: 0; }

  /* list view: standard theme assumes a white page */
  .fc-list, .fc-list-table, .fc-list-table th, .fc-list-day-cushion, .fc-list-event td { background: transparent !important; }
  .fc-list-day-cushion { color: var(--ink) !important; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.02em; }
  .fc-list-day-text, .fc-list-day-side-text { color: var(--ink) !important; }
  .fc-list-event-time { color: var(--muted) !important; font-size: 0.78rem; }
  .fc-list-event-title a { color: var(--ink) !important; text-decoration: none; text-transform: uppercase; font-size: 0.85rem; }
  .fc-list-event:hover td { background: rgba(255,255,255,0.06) !important; }
  .fc-list-empty { background: transparent !important; color: var(--muted) !important; }
  .fc-list-event-dot { border-radius: 0 !important; width: 10px !important; height: 10px !important; border-width: 5px !important; }

  #modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: var(--bg);
    border: 2px solid var(--ink);
    max-width: 420px;
    width: 100%;
    padding: 22px;
  }
  #modal img { width: 100%; display: none; margin-bottom: 14px; filter: grayscale(0.15); }
  #modal h3 { margin: 0 0 14px; text-transform: uppercase; font-size: 1.25rem; line-height: 1.15; letter-spacing: -0.01em; }
  #modal .meta { margin: 6px 0; font-size: 0.85rem; }
  #modal .meta b {
    display: inline-block; min-width: 72px; color: var(--muted);
    text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.06em; font-weight: 500;
  }
  #modal a.cta {
    display: inline-block; margin-top: 18px; padding: 10px 16px;
    background: var(--ink); color: var(--bg); text-decoration: none;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500;
    border: 2px solid var(--ink);
  }
  #modal a.cta:hover { background: var(--bg); color: var(--ink); }
  #modal button.close {
    float: right; background: none; border: 2px solid var(--ink); color: var(--ink);
    font-size: 0.9rem; cursor: pointer; width: 28px; height: 28px; font-family: inherit;
  }
  #modal button.close:hover { background: var(--ink); color: var(--bg); }
  footer {
    text-align: center; color: var(--muted); font-size: 0.72rem; padding: 18px 20px 30px;
    text-transform: uppercase; letter-spacing: 0.03em; border-top: 2px solid var(--line); margin-top: 10px;
  }
</style>
</head>
<body>
<header>
  <h1>Agenda<span>.</span> Barcelona</h1>
  <p>Conciertos en las salas pequeñas de directo de la ciudad · <span id="updated-at"></span></p>
</header>

<div id="layout">
  <aside id="venues">
    <button id="toggle-all">Marcar / desmarcar todas</button>
    <h2>Salas</h2>
    <div id="venue-list"></div>
  </aside>
  <div id="calendar-wrap">
    <div id="calendar"></div>
  </div>
</div>

<footer>Datos extraídos automáticamente de las webs de cada sala — pueden cambiar o fallar, comprueba siempre en la web oficial</footer>

<div id="modal-backdrop">
  <div id="modal">
    <button class="close" aria-label="Tancar">✕</button>
    <img id="modal-img" />
    <h3 id="modal-title"></h3>
    <p class="meta"><b>Sala</b><span id="modal-venue"></span></p>
    <p class="meta"><b>Fecha</b><span id="modal-date"></span></p>
    <p class="meta" id="modal-price-row"><b>Precio</b><span id="modal-price"></span></p>
    <a class="cta" id="modal-link" target="_blank" rel="noopener">Ver en la web de la sala →</a>
  </div>
</div>

<script>
// Flat, high-contrast palette lifted from Sala Vol's own site (salavol.com) — no soft pastels.
const PALETTE = ["#D7E507", "#FF3F00", "#544FF9", "#FF679F", "#FEC47E", "#50C999", "#4C2E64", "#8A3508"];

function colorFor(venue, venues) {
  const idx = venues.indexOf(venue);
  return PALETTE[idx % PALETTE.length];
}

function textColorFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luma > 0.55 ? "#000000" : "#f2f2ee";
}

async function main() {
  const res = await fetch("data/events.json");
  const data = await res.json();

  document.getElementById("updated-at").textContent =
    "actualizado " + new Date(data.generatedAt).toLocaleString("es-ES");

  const venues = [...new Set(data.events.map((e) => e.venue))].sort();
  const venueListEl = document.getElementById("venue-list");
  const enabled = new Set(venues);

  venues.forEach((venue) => {
    const label = document.createElement("label");
    label.className = "venue-check";
    label.innerHTML = `
      <input type="checkbox" checked data-venue="${venue}" />
      <span class="swatch" style="background:${colorFor(venue, venues)}"></span>
      ${venue}
    `;
    venueListEl.appendChild(label);
  });

  const calendarEl = document.getElementById("calendar");
  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    locale: "es",
    height: "auto",
    eventDisplay: "block",
    headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,listMonth" },
    buttonText: { today: "hoy", month: "mes", list: "lista" },
    events: [],
    eventClick(info) {
      info.jsEvent.preventDefault();
      openModal(info.event.extendedProps.raw);
    },
  });
  calendar.render();

  function refreshEvents() {
    const items = data.events
      .filter((e) => enabled.has(e.venue))
      .map((e) => {
        const bg = colorFor(e.venue, venues);
        return {
          title: e.title,
          start: e.start,
          url: e.url,
          backgroundColor: bg,
          borderColor: bg,
          textColor: textColorFor(bg),
          extendedProps: { raw: e },
        };
      });
    calendar.removeAllEvents();
    calendar.addEventSource(items);
  }

  venueListEl.addEventListener("change", (ev) => {
    const venue = ev.target.dataset.venue;
    if (ev.target.checked) enabled.add(venue);
    else enabled.delete(venue);
    refreshEvents();
  });

  document.getElementById("toggle-all").addEventListener("click", () => {
    const allOn = enabled.size === venues.length;
    venueListEl.querySelectorAll("input").forEach((cb) => (cb.checked = !allOn));
    enabled.clear();
    if (!allOn) venues.forEach((v) => enabled.add(v));
    refreshEvents();
  });

  refreshEvents();

  const backdrop = document.getElementById("modal-backdrop");
  function openModal(e) {
    document.getElementById("modal-title").textContent = e.title;
    document.getElementById("modal-venue").textContent = e.venue;
    document.getElementById("modal-date").textContent = new Date(e.start).toLocaleString("es-ES", {
      weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit",
    });
    document.getElementById("modal-price-row").style.display = e.price ? "block" : "none";
    document.getElementById("modal-price").textContent = e.price || "";
    document.getElementById("modal-link").href = e.url;
    const img = document.getElementById("modal-img");
    if (e.image) { img.src = e.image; img.style.display = "block"; } else { img.style.display = "none"; }
    backdrop.classList.add("open");
  }
  backdrop.addEventListener("click", (ev) => {
    if (ev.target === backdrop || ev.target.classList.contains("close")) backdrop.classList.remove("open");
  });
}

main().catch((err) => {
  document.getElementById("calendar").textContent = "Error cargando eventos: " + err.message;
  console.error(err);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.error("SW registration failed", err));
  });
}
</script>
</body>
</html>
